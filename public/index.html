nd Endpreis.","Comprueba condiciones, existencias y precio final.","Check offer terms, stock and final price.","Vérifiez conditions, stock et prix final.","Verifique condições, estoque e preço final."],["Bei Onlinekäufen Identität des Händlers und Zusatzkosten prüfen.","En compras en línea verifica el comercio y cargos adicionales.","For online purchases check seller identity and extra charges.","En ligne, vérifiez le vendeur et les frais supplémentaires.","Em compras online, verifique o vendedor e custos extras."]];function totals(){const v=id=>{const x=document.getElementById(id);return x.value===''?NaN:Number(x.value)};const a=v('income'),b=v('expenses'),p=v('pack'),g=v('grams');document.getElementById('balance').textContent=a>=0&&b>=0?'RD$ '+(a-b).toFixed(2):'—';document.getElementById('unit').textContent=p>=0&&g>0?'RD$ '+(p*1000/g).toFixed(2)+' / kg':'—'}document.querySelectorAll('.tools input').forEach(x=>x.addEventListener('input',totals));totals()</script></main><footer>AhorroRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Clever einkaufen","Compra inteligente","Shop smarter","Acheter malin","Comprar melhor"],intro=["Prüfe Endpreis, Lieferkosten, Garantie und Händler. Bewahre den Kaufbeleg auf.","Comprueba el precio final, envío, garantía y comercio. Guarda el recibo.","Check final price, delivery, warranty and seller. Keep the receipt.","Vérifiez le prix final, la livraison, la garantie et le vendeur. Gardez le reçu.","Verifique preço final, entrega, garantia e vendedor. Guarde o recibo."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];document.querySelectorAll('[data-t]').forEach(e=>e.textContent=extraLabels[Number(e.dataset.t)][i]);document.title=titles[i]+' | AhorroRD';}let stored;try{stored=localStorage.getItem('language')}catch{}apply(stored||navigator.language.slice(0,2));s.addEventListener('change',()=>{apply(s.value);try{localStorage.setItem('language',s.value)}catch{}})</script></body></html>
