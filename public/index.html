<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AhorroRD</title><meta name="description" content="Compra inteligente"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#16252d;font:17px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:#a34c17;color:#fff;padding:clamp(24px,6vw,70px);border-radius:24px}h1{font-size:clamp(32px,6vw,64px)}article,.calc,#results{padding:20px;background:#fff;margin:16px 0;border-radius:16px}button,input,select{font:inherit;max-width:100%;padding:10px;margin:5px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}a{color:#a34c17;overflow-wrap:anywhere}output{display:block;font-size:2rem}</style></head><body><header><strong>AhorroRD</strong><select id="language" aria-label="Language"><option value="de">DE</option><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="pt">PT</option></select></header><main><section><h1 id="heading">Compra inteligente</h1><p id="intro">Comprueba el precio final, envío, garantía y comercio. Guarda el recibo.</p></section><div class="calc"><label>RD$ <input id="price" type="number" min="0" value="1000"></label><label>% <input id="discount" type="number" min="0" max="100" value="10"></label><output id="total"></output></div><script>function calc(){let p=Number(document.querySelector('#price').value),d=Number(document.querySelector('#discount').value);document.querySelector('#total').textContent=p>=0&&d>=0&&d<=100?'RD$ '+(p*(1-d/100)).toFixed(2):'—'}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));calc()</script><article><a href="https://proconsumidor.gob.do/pro-consumidor-redobla-la-vigilancia-contra-las-ofertas-enganosas-del-viernes-negro/">Pro Consumidor</a><p>2026-11-25</p></article></main><footer>AhorroRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Clever einkaufen","Compra inteligente","Shop smarter","Acheter malin","Comprar melhor"],intro=["Prüfe Endpreis, Lieferkosten, Garantie und Händler. Bewahre den Kaufbeleg auf.","Comprueba el precio final, envío, garantía y comercio. Guarda el recibo.","Check final price, delivery, warranty and seller. Keep the receipt.","Vérifiez le prix final, la livraison, la garantie et le vendeur. Gardez le reçu.","Verifique preço final, entrega, garantia e vendedor. Guarde o recibo."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];document.title=titles[i]+' | AhorroRD';}let stored;try{stored=localStorage.getItem('language')}catch{}apply(stored||navigator.language.slice(0,2));s.addEventListener('change',()=>{apply(s.value);try{localStorage.setItem('language',s.value)}catch{}})</script></body></html>
