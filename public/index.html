<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AhorroRD</title><meta name="description" content="Compra inteligente"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#16252d;font:17px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:#a34c17;color:#fff;padding:clamp(24px,6vw,70px);border-radius:24px}h1{font-size:clamp(32px,6vw,64px)}article,.calc,#results{padding:20px;background:#fff;margin:16px 0;border-radius:16px}button,input,select{font:inherit;max-width:100%;padding:10px;margin:5px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}a{color:#a34c17;overflow-wrap:anywhere}output{display:block;font-size:2rem}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.tools label{display:block}.tools input{width:100%;margin:8px 0}.tools output{color:#a34c17}#more-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}#more-items p{margin:0;padding:16px;border:1px solid #d8dce0;border-radius:12px}#more-items a{display:block;font-size:.85rem;margin-top:8px}</style></head><body><header><strong>AhorroRD</strong><select id="language" aria-label="Language"><option value="de">DE</option><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="pt">PT</option></select></header><main><section><h1 id="heading">Compra inteligente</h1><p id="intro">Comprueba el precio final, envío, garantía y comercio. Guarda el recibo.</p></section><div class="calc"><label>RD$ <input id="price" type="number" min="0" value="1000"></label><label>% <input id="discount" type="number" min="0" max="100" value="10"></label><output id="total"></output></div><script>function calc(){let p=Number(document.querySelector('#price').value),d=Number(document.querySelector('#discount').value);document.querySelector('#total').textContent=p>=0&&d>=0&&d<=100?'RD$ '+(p*(1-d/100)).toFixed(2):'—'}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));calc()</script><article><a href="https://proconsumidor.gob.do/pro-consumidor-redobla-la-vigilancia-contra-las-ofertas-enganosas-del-viernes-negro/">Pro Consumidor</a><p>2026-11-25</p></article><div class="tools"><article><h2 data-t="0"></h2><label><span data-t="1"></span><input id="income" type="number" min="0" value="0"></label><label><span data-t="2"></span><input id="expenses" type="number" min="0" value="0"></label><output id="balance"></output></article><article><h2 data-t="3"></h2><label><span data-t="4"></span><input id="pack" type="number" min="0" value="100"></label><label><span data-t="5"></span><input id="grams" type="number" min="1" value="500"></label><output id="unit"></output></article></div><article><p data-t="6"></p><a href="https://proconsumidor.gob.do/inicia-el-ano-con-buen-pie-en-tus-finanzas-personales/">Pro Consumidor</a><p data-t="7"></p><a href="https://proconsumidor.gob.do/consejos-a-tomar-en-cuenta-a-la-hora-de-comprar-el-regalo-a-papa/">Pro Consumidor</a><p data-t="8"></p><a href="https://proconsumidor.gob.do/pro-consumidor-redobla-la-vigilancia-contra-las-ofertas-enganosas-del-viernes-negro/">Pro Consumidor</a></article><script>const extraLabels=[["Haushaltsbudget","Presupuesto familiar","Household budget","Budget familial","Orçamento familiar"],["Monatseinnahmen","Ingresos mensuales","Monthly income","Revenus mensuels","Renda mensal"],["Monatsausgaben","Gastos mensuales","Monthly expenses","Dépenses mensuelles","Despesas mensais"],["Grundpreis je kg","Precio por kg","Price per kg","Prix au kg","Preço por kg"],["Packungspreis (RD$)","Precio del paquete (RD$)","Package price (RD$)","Prix du paquet (RD$)","Preço da embalagem (RD$)"],["Gewicht (g)","Peso (g)","Weight (g)","Poids (g)","Peso (g)"],["Plane deine Einkäufe und setze ein Ausgabenlimit.","Planifica tus compras y fija un límite de gastos.","Plan purchases and set a spending limit.","Planifiez vos achats et fixez une limite.","Planeje compras e defina um limite de gastos."],["Prüfe Aktionsbedingungen, Vorrat und Endpreis.","Comprueba condiciones, existencias y precio final.","Check offer terms, stock and final price.","Vérifiez conditions, stock et prix final.","Verifique condições, estoque e preço final."],["Bei Onlinekäufen Identität des Händlers und Zusatzkosten prüfen.","En compras en línea verifica el comercio y cargos adicionales.","For online purchases check seller identity and extra charges.","En ligne, vérifiez le vendeur et les frais supplémentaires.","Em compras online, verifique o vendedor e custos extras."]];function totals(){const v=id=>{const x=document.getElementById(id);return x.value===''?NaN:Number(x.value)};const a=v('income'),b=v('expenses'),p=v('pack'),g=v('grams');document.getElementById('balance').textContent=a>=0&&b>=0?'RD$ '+(a-b).toFixed(2):'—';document.getElementById('unit').textContent=p>=0&&g>0?'RD$ '+(p*1000/g).toFixed(2)+' / kg':'—'}document.querySelectorAll('.tools input').forEach(x=>x.addEventListener('input',totals));totals()</script><article id="more-content"><h2 id="more-heading"></h2><div id="more-items"></div></article><script>const moreRows=[["Verlange eine schriftliche Garantie.","Solicita una garantía escrita.","Request a written warranty.","Demandez une garantie écrite.","Solicite garantia escrita."],["Prüfe Schulmaterial auf Vollständigkeit und Schäden.","Revisa que los útiles estén completos y sin daños.","Check school supplies for missing parts and damage.","Vérifiez que les fournitures sont complètes et intactes.","Confira se o material escolar está completo e intacto."],["Vergleiche bei Ratenkäufen die Gesamtsumme, nicht nur die Rate.","Compara el costo total del crédito, no solo la cuota.","Compare total credit cost, not just instalments.","Comparez le coût total du crédit, pas seulement la mensualité.","Compare o custo total do crédito, não só a parcela."],["Setze vor Weihnachtseinkäufen ein festes Budget.","Fija un presupuesto antes de las compras navideñas.","Set a budget before Christmas shopping.","Fixez un budget avant les achats de Noël.","Defina um orçamento antes das compras de Natal."],["Kontrolliere Altersangaben und Warnhinweise bei Spielzeug.","Revisa edades y advertencias de los juguetes.","Check toy age ratings and warnings.","Vérifiez les âges et avertissements des jouets.","Confira idades e avisos dos brinquedos."],["Dokumentiere beworbene Eigenschaften und Preise.","Guarda pruebas de las características y precios anunciados.","Keep evidence of advertised features and prices.","Conservez les preuves des caractéristiques et prix annoncés.","Guarde provas das características e preços anunciados."],["Kaufe bei nachvollziehbaren Händlern und verlange einen Beleg.","Compra en comercios identificables y pide comprobante.","Buy from identifiable sellers and request a receipt.","Achetez auprès de vendeurs identifiables et demandez un reçu.","Compre de vendedores identificáveis e peça comprovante."]],moreHeading=["Sieben weitere praktische Spartipps","Siete consejos prácticos adicionales","Seven more practical saving tips","Sept autres conseils pratiques","Mais sete dicas práticas"],moreSource=["https://proconsumidor.gob.do/pro-consumidor-lanza-campana-exige-tu-garantia-como-derecho-legal-de-los-consumidores/","https://proconsumidor.gob.do/lanza-campana-de-proteccion-para-el-regreso-a-clases/","https://proconsumidor.gob.do/recomendaciones-de-instituto-nacional-de-proteccion-de-los-derechos-del-consumidor-para-temporada-navidena-y-fin-de-ano/","https://proconsumidor.gob.do/recomendaciones-para-este-tiempo-de-navidad/","https://proconsumidor.gob.do/hace-recomendaciones-para-compra-segura-de-juguetes/","https://proconsumidor.gob.do/compre-un-producto-que-no-cumple-con-lo-ofertado/","https://proconsumidor.gob.do/lanza-campana-de-proteccion-para-el-regreso-a-clases/"];function more(i){document.querySelector('#more-heading').textContent=moreHeading[i];const root=document.querySelector('#more-items');root.replaceChildren();moreRows.forEach((r,j)=>{const p=document.createElement('p'),a=document.createElement('a');a.href=Array.isArray(moreSource)?moreSource[j]:moreSource;a.textContent="Pro Consumidor";p.append(document.createTextNode(r[i]+' · '),a);root.append(p)})}</script></main><footer>AhorroRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Clever einkaufen","Compra inteligente","Shop smarter","Acheter malin","Comprar melhor"],intro=["Prüfe Endpreis, Lieferkosten, Garantie und Händler. Bewahre den Kaufbeleg auf.","Comprueba el precio final, envío, garantía y comercio. Guarda el recibo.","Check final price, delivery, warranty and seller. Keep the receipt.","Vérifiez le prix final, la livraison, la garantie et le vendeur. Gardez le reçu.","Verifique preço final, entrega, garantia e vendedor. Guarde o recibo."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];document.querySelectorAll('[data-t]').forEach(e=>e.textContent=extraLabels[Number(e.dataset.t)][i]);more(i);document.title=titles[i]+' | AhorroRD';}let stored;try{stored=localStorage.getItem('language')}catch{}apply(stored||navigator.language.slice(0,2));s.addEventListener('change',()=>{apply(s.value);try{localStorage.setItem('language',s.value)}catch{}})</script></body></html>
