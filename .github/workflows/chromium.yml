name: Chromium smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: SITE_URL=https://example.com node build.mjs
      - run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const server=createServer((req,res)=>{try{const path=new URL(req.url,'http://localhost').pathname;res.setHeader('Content-Type',path.endsWith('.xml')?'application/xml':'text/html; charset=utf-8');res.end(readFileSync('public'+path+(path.endsWith('/')?'index.html':'')))}catch{res.statusCode=404;res.end()}});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const origin='http://127.0.0.1:'+server.address().port;
          const browser=await chromium.launch();
          try {
          for(const width of [375,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900},locale:'de-DE'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin+'/');
            assert.equal(await page.locator('html').getAttribute('lang'),'de');
            for(const lang of ['es','en','fr','pt','de']){
              await page.locator('#language').selectOption(lang);
              assert.equal(await page.locator('html').getAttribute('lang'),lang);
              await page.goto(origin+'/'+lang+'/');
              assert.equal(await page.locator('html').getAttribute('lang'),lang);
              assert.equal(await page.locator('link[hreflang]').count(),6);
              assert.equal(await page.locator('link[rel=canonical]').getAttribute('href'),'https://example.com/'+lang+'/');
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              await page.goto(origin+'/');
            }
            await page.locator('#language').selectOption('en');
            await page.locator('#price').fill('2000'); await page.locator('#discount').fill('25'); assert.equal(await page.locator('#total').innerText(),'RD$ 1500.00');
            await page.locator('#income').fill('25000'); await page.locator('#expenses').fill('21000'); assert.equal(await page.locator('#balance').innerText(),'RD$ 4000.00'); await page.locator('#pack').fill('180'); await page.locator('#grams').fill('500'); assert.equal(await page.locator('#unit').innerText(),'RD$ 360.00 / kg'); await page.locator('#grams').fill('0'); assert.equal(await page.locator('#unit').innerText(),'—'); assert.equal(await page.locator('#more-items p').count(),7);
            assert.ok((await page.locator('#compare-result').innerText()).includes('Cheaper per kg: B'));
            await page.locator('#b-price').fill('360');
            assert.ok((await page.locator('#compare-result').innerText()).includes('Same unit price'));
            await page.locator('#b-weight').fill('0');
            assert.equal(await page.locator('#compare-result').innerText(),'Check inputs');
            await page.locator('#b-weight').fill('1000');
            await page.locator('#b-price').fill('400');
            assert.ok((await page.locator('#compare-result').innerText()).includes('Cheaper per kg: A'));
            await page.clock.setFixedTime(new Date('2026-11-25T03:59:00Z'));
            await page.reload();
            assert.equal(await page.locator('#offer-list article[data-bank="caribe"][data-status="active"]').count(),6);
            assert.equal(await page.locator('#offer-list article[data-bank="caribe"][data-status="upcoming"]').count(),1);
            await page.clock.setFixedTime(new Date('2026-11-26T04:00:00Z'));
            await page.reload();
            assert.equal(await page.locator('#offer-list article[data-bank="caribe"][data-status="upcoming"]').count(),0);
            assert.equal(await page.locator('#offer-list article[data-bank="caribe"]').count(),6);
            assert.ok(!(await page.locator('#offer-list').innerText()).includes('Bennu')); for(const name of ['Punto Mac','KLIQUEA','Ophelia Original']) assert.ok((await page.locator('#offer-list').innerText()).includes(name));
            await page.clock.setFixedTime(new Date('2026-12-01T04:00:00Z'));
            await page.reload();
            assert.equal(await page.locator('#offer-list article').count(),0);
            assert.deepEqual(errors,[]);
            await page.close();
          }
          const xml=readFileSync('public/sitemap.xml','utf8');
          for(const l of ['de','es','en','fr','pt'])assert.ok(xml.includes('https://example.com/'+l+'/'));
          assert.ok(readFileSync('public/robots.txt','utf8').includes('https://example.com/sitemap.xml'));
          } finally {await browser.close();server.close()}
          console.log('Chromium build and feature checks passed');
          JS
